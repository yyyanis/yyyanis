name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2E31D1&color_dots=#ebedf0,#C9CAEC,#8C8FFF,#5B5DE6,#2E31D1
            dist/snake-dark.svg?palette=github-dark&color_snake=#8C8FFF&color_dots=#161b22,#22256A,#3A3E8C,#5B5DE6,#8C8FFF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
